name: LSIF
on:
  push:
    paths:
      - '**.go'
      - 'go.mod'
      - '.github/workflows/lsif.yml'
env:
  GOPROXY: "https://proxy.golang.org"

jobs:
  lsif-go:
    if: github.repository == 'flamego/validator'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate LSIF data
        uses: sourcegraph/lsif-go-action@33cb87a8bb8dc634f385db8d90463c3bddfd9c85 # master
      - name: Upload LSIF data to sourcegraph.com
        continue-on-error: true
        uses: docker://sourcegraph/src-cli@sha256:4b6c9f61d68a72a99e40622b0b2904feeac5fc78f5956d0748749beac0baedc7 # latest
        with:
          args: lsif upload -github-token=${{ secrets.GITHUB_TOKEN }}
      - name: Upload LSIF data to cs.unknwon.dev
        continue-on-error: true
        uses: docker://sourcegraph/src-cli@sha256:4b6c9f61d68a72a99e40622b0b2904feeac5fc78f5956d0748749beac0baedc7 # latest
        with:
          args: -endpoint=https://cs.unknwon.dev lsif upload -github-token=${{ secrets.GITHUB_TOKEN }}
